<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON FRONT｜霓虹球場</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
:root{--c:#00e5ff;--p:#b04dff;--g:#ffd54a;--card:#101830;--line:#1f3a66}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 0,#14204a,#070b18 70%);color:#e8f4ff;font-family:"Noto Sans TC",system-ui,sans-serif}
.screen{display:none;max-width:1000px;margin:0 auto;padding:16px}
.screen.on{display:block}
h1{font-size:clamp(34px,8vw,68px);margin:34px 0 4px;text-align:center;letter-spacing:4px;background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;color:transparent}
.sub{text-align:center;color:#7fa6c9;margin-bottom:28px;letter-spacing:6px}
.btn{background:linear-gradient(135deg,#0a2a44,#1b1050);border:1px solid var(--c);color:#fff;padding:12px 24px;border-radius:12px;font-size:16px;cursor:pointer;box-shadow:0 0 14px #00e5ff44;transition:.15s;font-family:inherit}
.btn:hover{box-shadow:0 0 24px #00e5ffaa;transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.big{padding:16px 40px;font-size:20px;min-width:260px}
.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:.15s}
.stage:hover{border-color:var(--c);box-shadow:0 0 20px #00e5ff55;transform:translateY(-3px)}
.stage.lock{opacity:.35;pointer-events:none}
.stage b{font-size:18px}
.stage small{color:#7fa6c9;display:block;margin-top:6px}
.stage .no{position:absolute;right:12px;top:2px;font-size:56px;font-weight:900;color:#ffffff10}
.stage .row{display:flex;gap:2px;margin-top:8px;flex-wrap:wrap}
.star{color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;position:relative;transition:.15s}
.pc:hover{border-color:var(--c)}
.pc.sel{border-color:var(--g);box-shadow:0 0 14px #ffd54a88}
.pc .nm{font-size:13px;display:block;margin-top:2px}
.cost{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#c040ff,#7a1fd0);border:2px solid #fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px #c040ff}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:10px}
.slot{aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;color:#9fc2e0;font-size:14px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dex>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:#9fc2e0;display:flex;gap:10px;align-items:center}
.dex b{color:#fff;font-size:15px}
/* ===== 戰鬥畫面 ===== */
#game.screen{max-width:none;padding:0}
#gwrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
#fieldBox{position:relative;width:min(100%,calc((100vh - 176px)*2))}
#cv{width:100%;aspect-ratio:2/1;display:block;border-radius:14px;border:1px solid var(--line);background:#000;box-shadow:0 0 30px #00e5ff22;touch-action:none}
#hudTop{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:14px;pointer-events:none;font-weight:800}
#hudTop div{background:#000a;border:1px solid var(--c);border-radius:10px;padding:4px 14px;font-size:clamp(13px,2vw,22px)}
#tools{position:absolute;left:10px;top:8px;display:flex;gap:6px}
#tools button{background:#000a;border:1px solid var(--c);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
#bar{width:min(100%,calc((100vh - 176px)*2));height:160px;display:flex;gap:10px;align-items:stretch}
#laserBox{width:130px}
#laserBtn{width:100%;height:100%;border-radius:14px;border:1px solid var(--c);background:linear-gradient(160deg,#08324a,#150a3a);color:#fff;font-weight:700;cursor:pointer;position:relative;overflow:hidden;touch-action:none}
#laserBtn .fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:#00e5ff55}
#laserBtn.ready{box-shadow:0 0 22px #00e5ff;animation:pl 1s infinite}
#laserBtn span{position:relative;font-size:14px}
@keyframes pl{50%{box-shadow:0 0 4px #00e5ff}}
#center{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#elixWrap{height:24px;background:#1a0b33;border:1px solid #7a1fd0;border-radius:12px;position:relative;overflow:hidden}
#elixFill{height:100%;width:50%;background:linear-gradient(90deg,#c040ff,#ff6bd6);box-shadow:0 0 12px #c040ff}
#elixNum{position:absolute;left:10px;top:0;line-height:22px;font-weight:800;font-size:14px}
#hand{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{position:relative;border-radius:12px;border:1px solid #2a4a7a;background:linear-gradient(160deg,#112042,#0a1030);color:#fff;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.card .n{font-size:12px}
.card.can{border-color:var(--c);box-shadow:0 0 12px #00e5ff77}
.card.no{filter:grayscale(.7) brightness(.6)}
.card.drag{opacity:.4}
#nextBox{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7fa6c9;font-size:12px;gap:4px}
#ghost{position:fixed;pointer-events:none;z-index:20;display:none;transform:translate(-50%,-50%)}
#end{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:30}
#end.on{display:flex}
#end .box{background:var(--card);border:1px solid var(--c);border-radius:20px;padding:30px 44px;text-align:center;box-shadow:0 0 40px #00e5ff55}
#end h2{font-size:42px;margin:0 0 12px}
#end p{color:#9fc2e0;line-height:1.7}
@media(max-width:700px){#laserBox{width:84px}#nextBox{display:none}}
</style>
</head>
<body>

<div id="title" class="screen on">
  <h1>NEON FRONT 2</h1>
  <div class="sub">霓 虹 球 場</div>
  <div class="center">
    <button class="btn big" onclick="show('modes')">▶ 開始遊戲</button>
    <button class="btn big" onclick="show('deck')">🃏 編輯牌組</button>
    <button class="btn big" onclick="show('dex')">📘 角色圖鑑</button>
    <button class="btn" onclick="resetSave()">🗑 清除進度</button>
  </div>
</div>

<div id="modes" class="screen">
  <div class="top"><button class="btn" onclick="show('title')">← 返回</button><b>選擇模式</b><span></span></div>
  <div class="center">
    <button class="btn big" onclick="show('stages')">🏟 闖關模式(8 關)</button>
    <button class="btn big" onclick="goEndless()">♾ 無盡模式<br><small id="bestTxt"></small></button>
  </div>
</div>

<div id="stages" class="screen">
  <div class="top"><button class="btn" onclick="show('modes')">← 返回</button><b>🌐 闖關地圖</b><span></span></div>
  <div class="map" id="map"></div>
</div>

<div id="deck" class="screen">
  <div class="top"><button class="btn" onclick="show('title')">← 返回</button><b>🃏 牌組(選 8 張)</b><span></span></div>
  <div class="slots" id="slots"></div>
  <div class="info" id="deckInfo"></div>
  <div class="grid" id="pool"></div>
</div>

<div id="dex" class="screen">
  <div class="top"><button class="btn" onclick="show('title')">← 返回</button><b>📘 圖鑑</b><span></span></div>
  <h3>我方部隊</h3><div class="dex" id="dexU"></div>
  <h3>敵方專屬</h3><div class="dex" id="dexE"></div>
</div>

<div id="game" class="screen">
  <div id="gwrap">
    <div id="fieldBox">
      <canvas id="cv" width="1200" height="600"></canvas>
      <div id="hudTop"><div id="hTimer">3:00</div><div id="hScore"></div><div id="hCrown"></div></div>
      <div id="tools">
        <button id="bPause">⏸</button><button id="bSpeed">x1</button><button id="bQuit">✖</button>
      </div>
    </div>
    <div id="bar">
      <div id="laserBox"><button id="laserBtn"><div class="fill"></div><span>⚡ 雷射砲<br><small>按住拖曳瞄準</small></span></button></div>
      <div id="center">
        <div id="elixWrap"><div id="elixFill"></div><span id="elixNum">5</span></div>
        <div id="hand"></div>
      </div>
      <div id="nextBox"><span>下一張</span><div id="nextCard"></div></div>
    </div>
  </div>
  <div id="ghost"></div>
</div>

<div id="end"><div class="box"><h2 id="endT"></h2><p id="endP"></p>
<button class="btn" onclick="show('modes')">回到選單</button></div></div>

<!-- 載入順序不要改 -->
<script src="data.js"></script>
<script src="menu.js"></script>
<script src="engine.js"></script>
<script src="battle.js"></script>
<script src="audio.js"></script>
</body>
</html>
